# The release: after the tests, semantic-release turns the new conventional commits into
# a version (release.config.mjs), publishes it to npm with the branch's dist-tag, and
# creates the GitHub release. Then the same version goes to GitHub Packages and ghcr.io.
# (A release made with GITHUB_TOKEN triggers no other workflow, so they are called here.)

name: Release

on:
  push:
    branches: [ "master", "releasing", "testing", "developement" ]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  HUSKY: 0

jobs:
  test:
    uses: ./.github/workflows/nodejs-ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write      # tags, release commit on master
      issues: write        # release notes may reference issues
      pull-requests: write
      id-token: write      # npm provenance
    outputs:
      version: ${{ steps.released.outputs.version }}
      channel: ${{ steps.released.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # semantic-release reads every tag
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
      - id: released
        name: new version, if any
        run: |
          tag=$(git tag --points-at HEAD --list 'v*' | sort -V | tail -1)
          [ -z "$tag" ] && exit 0
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          case "${{ github.ref_name }}" in
            master) echo "channel=latest" ;; releasing) echo "channel=rc" ;;
            testing) echo "channel=beta" ;; developement) echo "channel=dev" ;;
          esac >> "$GITHUB_OUTPUT"

  github-package:
    needs: release
    if: needs.release.outputs.version != ''
    uses: ./.github/workflows/publish-github-node-pkg.yml
    with:
      version: ${{ needs.release.outputs.version }}
      channel: ${{ needs.release.outputs.channel }}
    permissions:
      contents: read
      packages: write

  docker:
    needs: release
    if: needs.release.outputs.version != ''
    uses: ./.github/workflows/publish-docker-container.yml
    with:
      version: ${{ needs.release.outputs.version }}
      channel: ${{ needs.release.outputs.channel }}
    permissions:
      contents: read
      packages: write
