# Updates arrive where code is written: the developement branch
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: developement
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    target-branch: developement
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /docs
    target-branch: developement
    schedule:
      interval: weekly
