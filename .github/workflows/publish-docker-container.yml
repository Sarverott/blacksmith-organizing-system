# The released version as a container on ghcr.io/sarverott/blacksmith-organization-system,
# tagged with the version and its channel (latest, rc, beta, dev). Called by the release,
# or run by hand for a tag.

name: Publish Docker container

on:
  workflow_call:
    inputs:
      version: { type: string, required: true }
      channel: { type: string, required: true }
  workflow_dispatch:
    inputs:
      version: { description: "version to publish (tag v<version> must exist)", required: true }
      channel: { description: "latest, rc, beta or dev", required: true, default: dev }

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/blacksmith-organization-system
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=${{ inputs.channel }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
