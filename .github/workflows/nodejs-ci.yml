# Tests on every station of the branch flow: developement → revision → testing → releasing → master

name: Node.js CI

on:
  push:
    branches: [ "master", "developement", "revision", "testing", "releasing" ]
  pull_request:
    branches: [ "master", "revision", "testing", "releasing" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm test
