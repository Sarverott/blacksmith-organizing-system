# Updates arrive where code is written: the developement branch
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: developement
    schedule:
      interval: weekly
    ignore:
      # v10 needs conventional-changelog-writer 9+, but semantic-release's notes generator
      # still ships writer 8: release notes would fail. Lift when semantic-release updates.
      - dependency-name: conventional-changelog-conventionalcommits
        versions: [">=10"]
      # @commitlint/cz-commitlint (npm run commit) accepts inquirer 9-12 only
      - dependency-name: inquirer
        versions: [">=13"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: developement
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /docs
    target-branch: developement
    schedule:
      interval: weekly
