# yaml-language-server: $schema=https://taskfile.dev/schema.json
# The documentation: MkDocs over the markdown in this folder (config: mkdocs.yml, here).
# From the repository root: task docs:serve, task docs:build, task docs:lock

version: '3'

vars:
  MKDOCS: uv run --project {{.TASKFILE_DIR}} mkdocs

tasks:
  default:
    desc: list documentation tasks
    cmds: [task --list]
    silent: true

  serve:
    desc: live preview at http://127.0.0.1:8000
    dir: '{{.TASKFILE_DIR}}/..'
    cmds: ['{{.MKDOCS}} serve -f docs/mkdocs.yml']

  build:
    desc: build the site into site/ and fail on any warning (as Read the Docs should)
    dir: '{{.TASKFILE_DIR}}/..'
    cmds: ['{{.MKDOCS}} build --strict -f docs/mkdocs.yml']

  lock:
    desc: after editing pyproject.toml, refresh uv.lock and the requirements.txt Read the Docs installs
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - uv lock
      - uv export --no-hashes --no-header --no-annotate --no-emit-project -o requirements.txt
